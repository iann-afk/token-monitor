<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Recall — Self-test report</title>
  <style>
    :root {
      --bg: #ffffff; --bg2: #f6f7f9; --text: #15171a; --text2: #5b6068;
      --text3: #9098a3; --border: #e4e6eb; --green: #16a34a; --amber: #f59e0b; --red: #ef4444;
      --info: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1a1d22; --bg2: #23272d; --text: #e8eaed; --text2: #a8b0bc;
        --text3: #6b7280; --border: #2e333a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5;
      max-width: 880px; margin: 0 auto;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    .subtitle { color: var(--text2); font-size: 12px; margin-bottom: 24px; }
    .controls {
      display: flex; gap: 8px; margin-bottom: 16px; align-items: center;
      position: sticky; top: 0; background: var(--bg); padding: 8px 0;
      border-bottom: 1px solid var(--border); z-index: 10;
    }
    button {
      font-family: inherit; font-size: 13px; padding: 6px 14px;
      border: 1px solid var(--border); background: var(--bg2); color: var(--text);
      border-radius: 6px; cursor: pointer;
    }
    button:hover { background: var(--border); }
    button.primary { background: var(--info); color: white; border-color: var(--info); }
    button.primary:hover { background: #1d4ed8; }
    .status { font-size: 12px; color: var(--text2); margin-left: auto; }
    .probes { display: flex; flex-direction: column; gap: 8px; }
    .probe {
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .probe-head {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      background: var(--bg2);
    }
    .probe-head:hover { background: var(--border); }
    .probe-icon {
      width: 16px; height: 16px; border-radius: 50%;
      flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: bold; color: white;
    }
    .probe-icon.pending { background: var(--text3); }
    .probe-icon.running { background: var(--info); }
    .probe-icon.pass { background: var(--green); }
    .probe-icon.warn { background: var(--amber); }
    .probe-icon.fail { background: var(--red); }
    .probe-name { flex: 1; font-weight: 500; }
    .probe-detail-summary { color: var(--text2); font-size: 12px; }
    .probe-body {
      padding: 12px; background: var(--bg);
      border-top: 1px solid var(--border);
      display: none;
      font-family: ui-monospace, SF Mono, Menlo, monospace;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 400px; overflow: auto;
      color: var(--text2);
    }
    .probe.open .probe-body { display: block; }
    textarea {
      width: 100%; height: 240px;
      font-family: ui-monospace, SF Mono, Menlo, monospace;
      font-size: 11px; padding: 12px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg2); color: var(--text); resize: vertical;
    }
    .footer { margin-top: 16px; }
    .copy-status { font-size: 12px; color: var(--green); margin-left: 8px; }
    .meta { font-size: 11px; color: var(--text3); margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Self-test report</h1>
  <div class="subtitle">Click <strong>Run all probes</strong>, wait 5–10 seconds, then click <strong>Copy report</strong> and paste back to chat.</div>

  <div class="controls">
    <button id="run" class="primary">Run all probes</button>
    <button id="copy">Copy report</button>
    <span id="copy-status" class="copy-status"></span>
    <span class="status" id="status">idle</span>
  </div>

  <div id="probes" class="probes"></div>

  <div class="footer">
    <h2 style="font-size: 14px; margin: 24px 0 8px;">Plain-text report</h2>
    <div class="meta">This is what gets copied. You can also select and copy manually.</div>
    <textarea id="report" readonly placeholder="Run probes first, then this will populate."></textarea>
  </div>

  <script src="diagnostic.js"></script>
</body>
</html>
